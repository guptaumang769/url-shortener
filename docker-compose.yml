services:
  postgres:
    image: postgres:17-alpine
    container_name: urls-postgres
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urls
      POSTGRES_PASSWORD: urls
    ports:
      - "5432:5432"
    volumes:
      - urls-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urls -d urlshortener"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: urls-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  urls-pgdata:
