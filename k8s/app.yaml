apiVersion: v1
kind: Namespace
metadata:
  name: urlshortener
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: urls-config
  namespace: urlshortener
data:
  DB_URL: "jdbc:postgresql://postgres:5432/urlshortener"
  DB_USER: "urls"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  APP_BASE_URL: "http://urlshortener.local"
  RATELIMIT_CAPACITY: "20"
  RATELIMIT_REFILL: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: urls-secret
  namespace: urlshortener
type: Opaque
stringData:
  DB_PASSWORD: "urls"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: urls-app
  namespace: urlshortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: urls-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: urls-app
    spec:
      containers:
        - name: urls-app
          image: url-shortener:latest      # replace with your ECR/Docker Hub image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: urls-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: urls-secret
                  key: DB_PASSWORD
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits: { cpu: "1000m", memory: "768Mi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: urls-app
  namespace: urlshortener
spec:
  type: ClusterIP
  selector:
    app: urls-app
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: urls-app
  namespace: urlshortener
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: urls-app
  minReplicas: 2
  maxReplicas: 20        # read-heavy — scale out aggressively on CPU
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urls-ingress
  namespace: urlshortener
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: urlshortener.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urls-app
                port:
                  number: 80
